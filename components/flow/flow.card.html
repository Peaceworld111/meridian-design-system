<!-- @dsCard group="Components" viewport="700x300" name="Flow" subtitle="模块列表与 3 步 Stepper" -->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.lbl{font-size:11px;color:var(--text-muted);width:100%;margin-bottom:-4px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = (function(){
  const keys = ['Button','StatusBadge','Amount','DataTable','Drawer','QueueToolbar'];
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && keys.some(n => typeof v[n] === 'function')) return v;
  }
  return {};
})();

const { Stepper, SectionChecklist, Card, Button } = NS;
function Demo() {
  return (
    <div style={{display:'grid',gap:16}}>
      <Card><Stepper steps={['上传文件','检查结果','导入']} current={1} /></Card>
      <Card title="开户模块列表" action={<span style={{fontSize:12,color:'var(--text-muted)'}}>已保存 · 2 分钟前</span>}>
        <SectionChecklist done={5} total={8} items={[
          {state:'done', label:'公司身份', sub:'注册证书、商业登记证、章程', trailing:<span style={{fontSize:12,color:'var(--color-positive)'}}>已完成</span>},
          {state:'active', label:'人员身份验证', sub:'2 / 4 人已完成，等待 Wong Ka Ming、Chen Wei', trailing:<Button size="sm" variant="secondary">发送提醒</Button>},
          {state:'pending', label:'声明与签署', sub:'需要授权签署人签署', trailing:<span style={{fontSize:12,color:'var(--text-muted)'}}>未开始</span>},
        ]} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
