<!-- @dsCard group="Spacing" viewport="700x190" subtitle="布局骨架与内容宽度" name="Layout" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-page)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.s{width:96px}
.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-default)}
.n{font-size:11px;margin-top:5px;color:var(--text-primary)}
.h{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.lbl{font-size:11px;color:var(--text-muted);margin-bottom:8px}
</style></head><body><div style="display:flex;gap:0;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;height:104px">
   <div style="width:120px;background:var(--color-surface);border-right:1px solid var(--border-default);font-size:11px;color:var(--text-muted);padding:8px">侧栏 240 / 220</div>
   <div style="flex:1;background:var(--color-paper)">
     <div style="height:26px;background:var(--color-surface);border-bottom:1px solid var(--border-default);font-size:11px;color:var(--text-muted);padding:6px 8px;box-sizing:border-box">顶栏 52</div>
     <div style="padding:10px;font-size:11px;color:var(--text-muted)">内容 padding 24 · 表单 max 640/760 · 列表 max 1040–1200</div>
   </div>
   <div style="width:96px;background:var(--color-surface);border-left:1px solid var(--border-default);font-size:11px;color:var(--text-muted);padding:8px">抽屉 480 / 640 / 720</div></div></body></html>
