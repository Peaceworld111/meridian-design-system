<!-- @dsCard group="Colors" viewport="700x150" subtitle="风险三档，与状态色同一套底色" name="Colors Risk" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-page)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.s{width:96px}
.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-default)}
.n{font-size:11px;margin-top:5px;color:var(--text-primary)}
.h{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.lbl{font-size:11px;color:var(--text-muted);margin-bottom:8px}
</style></head><body><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
   <span style="display:inline-flex;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;background:var(--color-risk-high-soft);color:var(--color-risk-high)">高</span>
   <span style="display:inline-flex;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;background:var(--color-risk-mid-soft);color:var(--color-risk-mid)">中</span>
   <span style="display:inline-flex;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;background:var(--color-risk-low-soft);color:var(--color-risk-low)">低</span>
   <span style="font-size:12px;color:var(--text-secondary)">填充徽章而非彩色文字——密集表格里扫视更快</span></div>
   <div style="margin-top:14px" class="h">--color-risk-high / -mid / -low (+ -soft)</div></body></html>
