<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-page)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.s{width:96px}
.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-default)}
.n{font-size:11px;margin-top:5px;color:var(--text-primary)}
.h{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.lbl{font-size:11px;color:var(--text-muted);margin-bottom:8px}
</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--color-primary)"></div><div class="n">primary</div><div class="h">#2554E6</div></div><div class="s"><div class="chip" style="background:var(--color-primary-hover)"></div><div class="n">primary-hover</div><div class="h">#1C45C4</div></div><div class="s"><div class="chip" style="background:var(--color-primary-soft)"></div><div class="n">primary-soft</div><div class="h">#E8EEFD</div></div><div class="s"><div class="chip" style="background:var(--color-primary-tint)"></div><div class="n">primary-tint</div><div class="h">#F8FAFF</div></div></div><div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">soft = 选中行 / 徽标底；tint = 表单选中卡底。主色从不用于装饰或图表。</div></body></html>
