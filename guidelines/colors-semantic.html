<!-- @dsCard group="Colors" viewport="700x200" subtitle="语义色只表达状态，不表达资金方向" name="Colors Semantic" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--surface-page)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.s{width:96px}
.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-default)}
.n{font-size:11px;margin-top:5px;color:var(--text-primary)}
.h{font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.lbl{font-size:11px;color:var(--text-muted);margin-bottom:8px}
</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--color-positive)"></div><div class="n">positive</div><div class="h">#12805C</div></div><div class="s"><div class="chip" style="background:var(--color-positive-soft)"></div><div class="n">positive-soft</div><div class="h">#E3F3EC</div></div><div class="s"><div class="chip" style="background:var(--color-warning)"></div><div class="n">warning</div><div class="h">#B7791F</div></div><div class="s"><div class="chip" style="background:var(--color-warning-soft)"></div><div class="n">warning-soft</div><div class="h">#FBF1DC</div></div><div class="s"><div class="chip" style="background:var(--color-negative)"></div><div class="n">negative</div><div class="h">#C4322D</div></div><div class="s"><div class="chip" style="background:var(--color-negative-soft)"></div><div class="n">negative-soft</div><div class="h">#FBE6E5</div></div><div class="s"><div class="chip" style="background:var(--color-state-neutral)"></div><div class="n">state-neutral</div><div class="h">#5B6B8C</div></div></div><div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">收 / 付用 <b>+</b> 与 <b>−</b>（U+2212）表达，绝不用红绿。</div></body></html>
