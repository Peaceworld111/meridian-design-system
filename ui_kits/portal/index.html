<!-- @startingPoint section="Screens" subtitle="客户端主框架 + 总览" viewport="1180x760" -->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>Meridian · 客户端</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = (function(){
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && typeof v.AppShell === 'function' && typeof v.OverviewScreen === 'function') return v;
  }
  return {};
})();
const { AppShell, OverviewScreen, ExchangeScreen, PaymentsScreen, Card, EmptyState, Button } = NS;

function Placeholder({ name }) {
  return (
    <Card>
      <EmptyState title={name + " · 本 kit 未收录"} body="该界面存在于原型中，但不在这套 UI kit 的三屏范围内。" />
    </Card>
  );
}

function App() {
  const [view, setView] = React.useState('overview');
  let screen;
  if (view === 'overview') screen = <OverviewScreen onNavigate={setView} />;
  else if (view === 'exchange') screen = <ExchangeScreen />;
  else if (view === 'payments') screen = <PaymentsScreen />;
  else screen = <Placeholder name={view} />;
  return <AppShell view={view} onNavigate={setView}>{screen}</AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
